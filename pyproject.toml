[project]
name = "api-dev-tutor-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maximino Castillo", email = "maxcastgarcia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "huggingface-hub>=1.5.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.1",
]

[tool.fastapi]
entrypoint = "src.server:app"

# This is an application, not a library: uv installs dependencies only and
# does not build/install the project itself.
[tool.uv]
package = false

[dependency-groups]
finetuned = [
    "accelerate>=1.15.0",
    "peft>=0.21.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "transformers>=5",
    "trl>=1.14.0",
]
